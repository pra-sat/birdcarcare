<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อมูลสมาชิก</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../theme.css">
  <!-- ตัวช่วยวาดป้ายทะเบียน ใช้ร่วมกับหน้าแอดมิน ต้องมาก่อน script.js -->
  <script src="../plate_data.js"></script>
  <script src="../theme.js" defer></script>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-box">
        <div class="spinner"></div>
        <p>⏳ กำลังโหลดข้อมูลสมาชิก...</p>
      </div>
    </div>
  
  <div class="container">
    <h2>ข้อมูลสมาชิก</h2>

    <div id="memberInfo" class="card-list"></div>

    <!-- ปุ่มหลักขึ้นก่อน (สลับลำดับ 13 ก.ย. 2569 ให้ตรงกับตัวจำลองที่อนุมัติ)
         ทั้งสองปุ่มผูกด้วย id/onclick จึงสลับที่ได้โดยไม่กระทบสคริปต์ -->
    <!-- 20 ก.ย. 2569 — ปุ่มแสดง QR ย้ายไปอยู่ในกรอบของรถแต่ละคันแล้ว
         ลูกค้าจะได้บอกได้ว่ากำลังรับแต้มให้คันไหน แอดมินไม่ต้องเดาตอนสแกน
         ปุ่มนี้ซ่อนไว้เป็นทางถอย เผื่อกรณีที่วาดการ์ดรถไม่สำเร็จ
         (showQRSection() ไม่ส่งเลขคัน = ใช้คันแรก เหมือนพฤติกรรมเดิม) -->
    <button class="btn hidden" id="qrBtn" onclick="showQRSection()">📱 แสดง QR รับแต้ม</button>
    <button class="btn history-toggle" id="toggleHistory">▼ ดูประวัติการใช้บริการ</button>

    <!-- พื้นที่แสดงประวัติ -->
    <div id="historySection" class="card hidden">
      <div class="history-section-wrapper">
        <!-- ตารางจะถูกเติมผ่าน JS -->
      </div>
    </div>

    <button class="btn close small" onclick="liff.closeWindow()">ปิดหน้าต่าง</button>
    <p class="notice">❕ หากต้องการแก้ไขข้อมูล กรุณาทักแชทหรือแจ้ง Admin</p>
  </div>
  
  <!-- ✅ Section แสดง QR
       ⚠️ .qr-popup ต้องคง position:fixed ของ style.css ไว้ ห้าม theme.css ทับเป็น relative
          (ถ้าทับ ป๊อปอัปจะไหลไปอยู่ท้ายหน้า เคยพลาดมาแล้ว 13/9/2569) -->
  <div id="qrSection" class="qr-popup hidden">
    <div class="qr-popup-inner">
      <p class="qr-head">ยื่นให้พนักงานสแกน</p>
      <canvas id="qrCanvas"></canvas>
      <p id="qrUserInfo"></p>
      <div class="qr-timer">
        <span class="qr-timer-lbl">หมดอายุใน</span>
        <span class="qrcount" id="qrCountdown">5:00</span>
      </div>
      <button class="btn outline" id="closeQRBtn">ปิด</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  
</body>
</html>
