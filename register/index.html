<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก</title>
    <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../theme.css">
  <script src="../theme.js" defer></script>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <h2>สมัครสมาชิก</h2>
        <form id="registrationForm">
            <!-- เอาช่องแสดง User ID (LINE) ออก 19 ก.ย. 2569
                 เป็นช่องอ่านอย่างเดียวที่ลูกค้าไม่ได้ใช้และไม่ควรต้องเห็น
                 ⚠️ ไม่กระทบการสมัคร — ค่าที่ส่งจริงใช้ตัวแปร userId ใน script.js
                    (ได้จาก liff.getProfile() โดยตรง) ช่องนี้แค่โชว์เฉย ๆ -->
            <div class="form-group">
                <label for="name">ชื่อ:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="phone">เบอร์โทร:</label>
                <input type="tel" id="phone" name="phone" placeholder="0812345678" required>
            </div>

            <!-- ── เลือกรถ ──────────────────────────────────────────────────
                 ยี่ห้อ / รุ่น / ปี ถูกเก็บใน input hidden 3 ช่องด้านล่าง
                 ส่วนที่เห็นด้านบนเป็นตัวช่วยเลือกเท่านั้น
                 ⚠️ ห้ามเปลี่ยน id ของ hidden ทั้ง 4 ช่อง (brand/model/year/category)
                    โค้ดส่งข้อมูลอ่านจาก 4 ช่องนี้ตรง ๆ                        -->
            <div class="form-group">
                <label>ประเภทรถ:</label>
                <div class="veh-seg" role="group" aria-label="เลือกประเภทรถ">
                    <button type="button" id="tyCar"  class="veh-opt is-on">🚙 รถยนต์</button>
                    <button type="button" id="tyMoto" class="veh-opt">🛵 มอเตอร์ไซค์</button>
                </div>
            </div>

            <div id="carPicker" class="car-picker"></div>

            <!-- ── ทะเบียนรถ (บังคับกรอก) ───────────────────────────────
                 เก็บลงคอลัมน์ R/S ของ Customer_Master ผ่าน plate.gs
                 ใช้เป็นตัวกันสมัครรถซ้ำด้วย จึงต้องกรอกให้ครบ         -->
            <div class="form-group" id="plateGroup">
              <label>ทะเบียนรถ <span class="pl-req">*</span>
                <span class="pl-opt">— ภาษาไทยเท่านั้น</span></label>
              <div class="pl-grid">
                <div>
                  <input type="text" id="plateHead" class="pl-in" placeholder="1กร"
                         autocomplete="off" maxlength="5" lang="th" required>
                  <div class="pl-eg">หมวด เช่น <b>1กร</b> · <b>ขค</b></div>
                </div>
                <div>
                  <input type="text" id="plateTail" class="pl-in" placeholder="1723"
                         inputmode="numeric" autocomplete="off" maxlength="4" required>
                  <div class="pl-eg">เลขท้าย เช่น <b>1723</b></div>
                </div>
              </div>
              <select id="plateProvince" class="pl-in pl-prov" required></select>
              <div class="pl-eg">จังหวัดดูจากตัวหนังสือแถวล่างของป้าย</div>
              <div class="pl-preview" id="platePreview" hidden></div>
              <div class="pl-warn" id="plateWarn" hidden></div>
            </div>

            <input type="hidden" id="brand" name="brand">
            <input type="hidden" id="model" name="model">
            <input type="hidden" id="year"  name="year">
            <input type="hidden" id="category">
            <input type="hidden" id="channel" value="LINE">

            <button id="submitBtn" type="submit">สมัครสมาชิก</button>
            <div id="statusMessage" style="text-align:center; color:green; font-weight:bold;"></div>
        </form>
    </div>
    <script src="all_car_model.js" onerror="alert('ไม่สามารถโหลดข้อมูลยี่ห้อรถได้ กรุณาลองใหม่หรือติดต่อ Admin')"></script>
    <script src="../plate_data.js"></script>
    <script src="script.js"></script>
</body>
</html>
