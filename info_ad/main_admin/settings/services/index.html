<!-- ปรับโครงหน้า HTML ตามการตรวจสอบล่าสุด -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการบริการ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../../theme.css">
  <script src="../../../../theme.js" defer></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js" defer></script>
</head>
<body class="hidden">
  <div class="container">
    <!-- Admin Info -->
    <div class="profile-box">
      <p>👤 <span id="adminName">-</span> | 🛡️ <span id="adminLevel">-</span> | 📛 <span id="adminRole">-</span></p>
    </div>

    <!-- Action Buttons -->
    <div class="button-group">
      <button id="addServiceBtn" class="btn">➕ เพิ่มบริการ</button>
      <button id="showAllBtn" class="btn">📋 ดูรายการทั้งหมด</button>
      <button id="filterActiveBtn" class="btn outline">🟢 เฉพาะที่เปิดใช้งาน</button>
    </div>

    <!-- Service List -->
    <div id="serviceList" class="hidden service-list"></div>

    <!-- Bottom Navigation -->
    <div class="button-group bottom">
      <a id="backBtn" class="btn outline" href="../index.html">🔙 กลับหน้าหลัก</a>
      <button id="logoutBtn" class="btn danger">🚪 ออกจากระบบ</button>
    </div>
  </div>

  <!-- Add Service Popup -->
  <div id="addPopup" class="popup hidden">
    <div class="popup-content">
      <h2>➕ เพิ่มบริการใหม่</h2>
      <label>ชื่อบริการ <input type="text" id="addName"></label>
      <label>ราคา <input type="number" id="addPrice"></label>
      <label>แต้ม <input type="number" id="addPoint"></label>
      <label>รายละเอียด <textarea id="addDetail"></textarea></label>
      <div class="popup-actions">
        <button onclick="submitAddService()">✅ บันทึก</button>
        <button class="danger" onclick="closeAddPopup()">❌ ปิด</button>
      </div>
    </div>
  </div>

  <!-- View/Edit Service Popup -->
  <div id="viewPopup" class="popup hidden">
    <div class="popup-content">
      <h2 id="popupTitle">📄 รายละเอียดบริการ</h2>
      <label>ชื่อบริการ <input type="text" id="viewName" disabled></label>
      <label>ราคา <input type="number" id="viewPrice" disabled></label>
      <label>แต้ม <input type="number" id="viewPoint" disabled></label>
      <label>รายละเอียด <textarea id="viewDetail" disabled></textarea></label>
      <label>
        เปิดใช้งาน <input type="checkbox" id="viewStatus" onchange="toggleServiceStatus()">
      </label>
      <div class="popup-actions">
        <button id="editBtn" onclick="toggleEditMode()">✏️ แก้ไข</button>
        <button id="saveBtn" class="hidden" onclick="saveEditedService()">💾 บันทึก</button>
        <button class="danger" onclick="deleteService()">🗑️ ลบ</button>
        <button class="danger" onclick="closeViewPopup()">❌ ปิด</button>
      </div>
    </div>
  </div>
</body>
</html>
