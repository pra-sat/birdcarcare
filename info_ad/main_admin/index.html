<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../theme.css">
  <!-- ข้อมูล/ตัวช่วยเรื่องทะเบียนรถ ต้องมาก่อน script.js ที่เรียกใช้ -->
  <script src="../../plate_data.js"></script>
  <script src="../../theme.js" defer></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- 🔴 เอา html5-qrcode ออกจากตรงนี้แล้ว (14 ก.ย. 2569)
       ต้นเหตุที่หน้าแอดมิน "ค้าง" ตอนเปิด:
         DOMContentLoaded รอสคริปต์ defer ทุกตัวโหลดและรันให้เสร็จก่อน
         ไลบรารีนี้หนัก 375 KB และเขียน URL แบบไม่ระบุเวอร์ชัน
         unpkg จึงต้อง redirect ไปหา /html5-qrcode@2.3.8/... ก่อนอีกหนึ่งรอบ
         โค้ดเริ่มทำงานตอน DOMContentLoaded ทุกอย่างจึงรอไฟล์นี้อยู่
         ทั้งที่ใช้เฉพาะตอนกดปุ่มสแกนเท่านั้น
       ตอนนี้โหลดตอนต้องใช้แทน (ดู ensureQrLibrary ใน script.js)
       และอุ่นไว้เบื้องหลังหลังหน้าโผล่แล้ว พอกดสแกนจึงพร้อมใช้ทันที -->
  <script src="script.js" defer></script>
</head>
<body style="display:none;">
  <div class="container">
    <h2>🛠 แผงควบคุมผู้ดูและระบบ</h2>
    <div class="profile">
      <p>👤 คุณ: <span id="adminName">-</span></p>
      <p>🛡️ ระดับ: <span id="adminLevel">-</span></p>
      <p>💼 บทบาท: <span id="adminRole">-</span></p>
    </div>

    <div class="admin-buttons">
<!--      <a class="btn hidden" data-menu="feedback" href="feedback/index.html">💬 ข้อเสนอแนะ</a> -->
      <button class="btn hidden" id="scanBtn">🔍 สแกน QR</button>
      <!-- ตรวจว่าเครื่องนี้ยืนยันตัวตนกับ LINE ได้ครบไหม — ตรวจอย่างเดียว ไม่แก้ข้อมูล
           ใช้ก่อนเปิดโหมดบังคับใน security.gs · แตะครั้งเดียวต่อเครื่องก็พอ -->
      <button class="btn outline hidden" id="secTestBtn">🔐 ตรวจความปลอดภัย</button>
<!--      <a class="btn hidden" data-menu="stats" href="stats/index.html">📊 รายงาน</a> -->
<!--      <a class="btn hidden" data-menu="settings" href="settings/index.html">⚙️ ตั้งค่า</a> -->
    </div>
    <button class="btn danger" type="button" onclick="logout()">🚪 ออกจากระบบ</button>
  </div>

  <!-- ✅ Scan Section (ไม่ใช้ Popup อีกต่อไป) -->
  <div id="scanSection" class="scan-section hidden">
    <h3>📷 กล้องสแกน QR ลูกค้า</h3>
    <div id="reader" class="camera-box"></div>
    <input type="tel" id="manualPhone" placeholder="หรือกรอกเบอร์โทร" class="input-field" />
    <div class="scan-controls">
      <button class="btn" id="scannerSearchBtn">🔍 ค้นหา</button>
      <button class="btn" id="scannerSwitchBtn">🔁 สลับกล้อง</button>
    </div>
  </div>

</body>
</html>
